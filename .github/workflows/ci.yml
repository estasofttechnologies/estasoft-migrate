name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: Code standards and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: PHP syntax
        run: composer lint
      - name: WordPress coding standards
        run: composer cs
      - name: PHPStan
        run: composer stan

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sodium, pdo_sqlite, zlib
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test

  integration:
    name: Integration tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql:8.0
          - db: mariadb:10.11
    services:
      database:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sodium, mysqli, zlib
          tools: composer, wp-cli
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Install WordPress and a second, empty database
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE wp_test; CREATE DATABASE wp_dest;"
          mkdir -p "$RUNNER_TEMP/wp"
          cd "$RUNNER_TEMP/wp"
          wp core download --quiet
          wp config create --dbname=wp_test --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --url=http://localhost --title=Test --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
          echo "ESTM_WP_ROOT=$RUNNER_TEMP/wp" >> "$GITHUB_ENV"
          echo "ESTM_DEST_DB=wp_dest" >> "$GITHUB_ENV"
      - run: vendor/bin/phpunit -c phpunit-integration.xml.dist

  scripts:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check every script parses
        run: find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: No innerHTML in screens
        run: |
          if grep -rn "innerHTML\|insertAdjacentHTML\|document.write" assets/js; then
            echo "Build the page with ESTM.h(); see docs/UI.md." >&2
            exit 1
          fi

  package:
    name: Build the installable zip
    runs-on: ubuntu-latest
    needs: [standards, unit, scripts]
    steps:
      - uses: actions/checkout@v4
      - run: bin/build-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: estasoft-migrate
          path: dist/estasoft-migrate-*.zip
